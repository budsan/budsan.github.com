<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>funk — formula synth</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>funk</h1>
    <label>Rate
      <select id="rate">
        <option value="44100">44100 Hz</option>
        <option value="22050">22050 Hz</option>
      </select>
    </label>
    <label>Depth
      <select id="depth">
        <option value="float">float (-1.0 … 1.0)</option>
        <option value="s16">16-bit signed (-32768 … 32767)</option>
        <option value="s8">8-bit signed (-128 … 127)</option>
      </select>
    </label>
    <label>Examples
      <select id="preset">
        <option value="">—</option>
      </select>
    </label>
    <span class="hint">Variables: <code>t</code> sample count · <code>rate</code> samples/sec · all <code>Math</code> functions (<code>sin</code>, <code>PI</code>, …) plus <code>TAU</code> · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> play/stop</span>
  </header>

  <main id="editor-wrap">
    <textarea id="code" spellcheck="false"></textarea>
  </main>

  <div id="status" class="ok">Ready</div>

  <footer>
    <div class="controls">
      <button id="play" class="play" title="Play / Stop (Ctrl+Enter)">▶ Play</button>
      <label class="vol">Volume
        <input id="volume" type="range" min="0" max="100" value="50">
        <span id="volval">50%</span>
      </label>
      <div class="readout">
        <span>t = <b id="tval">0</b></span>
        <span><b id="secs">0.00</b> s</span>
        <span>peak <b id="peak">—</b></span>
        <span class="legend"><i class="l"></i>left <i class="r"></i>right</span>
      </div>
    </div>
    <canvas id="spectrum"></canvas>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
